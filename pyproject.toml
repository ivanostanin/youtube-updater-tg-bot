[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-updater-tg-bot"
version = "0.1.0"
description = "A Telegram bot that provides YouTube channel updates"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "nma.ro", email = "github@nma.ro" },
]
keywords = [
    "telegram",
    "bot",
    "youtube",
    "notifications",
    "pubsubhubbub",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "python-telegram-bot==22.5",
    "python-telegram-bot[job-queue]",
    "starlette==0.48.0",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy[asyncio]==2.0.44",
    "aiosqlite==0.21.0",
    "alembic>=1.17.2",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.12.0",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "feedparser==6.0.12",
    "boto3>=1.40.74",
    "pyyaml>=6.0.3",
    "prometheus-client>=0.23.1",
    "python-json-logger>=4.0.0",
    "telegramify-markdown>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "pytest-docker==3.2.5",
    "pytest-mock>=3.15.1",
    "allure-pytest==2.15.0",
    "ruff>=0.14.5",
    "mypy==1.18.2",
    "pre-commit>=4.4.0",
    "types-PyYAML==6.0.12.20250915",
    "boto3-stubs[full]>=1.41.3"
]

[project.urls]
Homepage = "https://github.com/username/youtube-updater-tg-bot"
Repository = "https://github.com/username/youtube-updater-tg-bot"
Issues = "https://github.com/username/youtube-updater-tg-bot/issues"

[project.scripts]
clean-allure = "src.utils.allure_cleanup:main"
youtube-updater-tg-bot = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TID252", # relative imports
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "feedparser",
    "allure_pytest",
    "telegramify_markdown",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = [
    "misc",
    "no-untyped-def",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
