# Default values for youtube-updater-tg-bot
replicaCount: 1

image:
  repository: youtube-updater-tg-bot
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: youtube-bot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: youtube-bot-tls
  #    hosts:
  #      - youtube-bot.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
# Example node affinity configuration to pin pod to specific node:
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: kubernetes.io/hostname
#              operator: In
#              values:
#                - node-hostname-or-ip
# Example pod affinity to co-locate with other pods:
#  podAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      - labelSelector:
#          matchExpressions:
#            - key: app
#              operator: In
#              values:
#                - database
#        topologyKey: "kubernetes.io/hostname"
# Example pod anti-affinity to spread pods across nodes:
#  podAntiAffinity:
#    preferredDuringSchedulingIgnoredDuringExecution:
#      - weight: 100
#        podAffinityTerm:
#          labelSelector:
#            matchExpressions:
#              - key: app.kubernetes.io/name
#                operator: In
#                values:
#                  - youtube-updater-tg-bot
#          topologyKey: "kubernetes.io/hostname"

# Bot configuration
bot:
  # Telegram Bot Token (required)
  # Can be set via values or external secret
  telegramBotToken: ""

  # YouTube API Key (required)
  # Can be set via values or external secret
  youtubeApiKey: ""

  # Database configuration
  database:
    # SQLite file path for persistent storage
    url: "sqlite+aiosqlite:///./data/bot.db"

  # Webhook configuration
  webhook:
    host: "0.0.0.0"
    port: 8000
    path: "/webhook"
    # Full callback URL for YouTube webhook notifications
    # This is the publicly accessible URL where YouTube will send notifications
    # Example: https://<hostname>/webhook/youtube
    callbackUrl: ""

  # Logging configuration
  logLevel: "INFO"

objectStorage:
  enabled: false
  endpoint: ""
  namespace: ""
  region: "us-ashburn-1"
  bucket: ""
  prefix: "db-backups/"
  useNamespacePath: false
  verifySSL: true
  accessKey: ""
  secretKey: ""
  lifecycleDays: 30
  restoreOnStartup:
    enabled: true
    force: false

backupJob:
  enabled: true
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Persistent Volume for SQLite database
persistence:
  enabled: true
  # Create new PVC or use existing one
  create: true
  # Name of existing PVC to use (when create: false)
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data
  # Annotations for PVC
  annotations: {}

# External secrets configuration
# If you're using external-secrets operator
externalSecrets:
  enabled: false
  secretStore:
    name: ""
    kind: SecretStore  # or ClusterSecretStore
  refreshInterval: 1h
  target:
    name: youtube-bot-secrets
  data:
    - secretKey: telegram-bot-token
      remoteRef:
        key: youtube-bot/telegram-token
    - secretKey: youtube-api-key
      remoteRef:
        key: youtube-bot/youtube-api-key

# ConfigMap for non-sensitive configuration
config:
  # Additional environment variables
  extraEnvVars: {}
    # CUSTOM_VAR: "value"
