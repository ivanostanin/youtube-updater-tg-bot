apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "youtube-updater-tg-bot.fullname" . }}
  labels:
    {{- include "youtube-updater-tg-bot.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  serviceName: {{ include "youtube-updater-tg-bot.fullname" . }}
  selector:
    matchLabels:
      {{- include "youtube-updater-tg-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "youtube-updater-tg-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "youtube-updater-tg-bot.serviceAccountName" . }}
      {{- if and .Values.persistence.enabled .Values.objectStorage.restoreOnStartup.enabled }}
      initContainers:
        - name: restore-database
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - "-u"
            - scripts/restore-db.py
            - "--destination-path"
            - {{ printf "%s/bot.db" .Values.persistence.mountPath | quote }}
          env:
            {{- include "youtube-updater-tg-bot.objectStorageEnv" . | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bot.webhook.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "youtube-updater-tg-bot.secretName" . }}
                  key: telegram-bot-token
            - name: YOUTUBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "youtube-updater-tg-bot.secretName" . }}
                  key: youtube-api-key
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: database-url
            - name: WEBHOOK_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: webhook-host
            - name: WEBHOOK_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: webhook-port
            - name: WEBHOOK_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: webhook-path
            - name: WEBHOOK_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: webhook-callback-url
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
                  key: log-level
            {{- include "youtube-updater-tg-bot.objectStorageEnv" . | nindent 12 }}
            {{- range $key, $value := .Values.config.extraEnvVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (and .Values.persistence.enabled .Values.persistence.existingClaim) .Values.volumes }}
      volumes:
        {{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .Values.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
