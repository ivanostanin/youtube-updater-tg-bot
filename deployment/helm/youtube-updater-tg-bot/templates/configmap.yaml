apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "youtube-updater-tg-bot.configMapName" . }}
  labels:
    {{- include "youtube-updater-tg-bot.labels" . | nindent 4 }}
data:
  database-url: {{ .Values.bot.database.url | quote }}
  webhook-host: {{ .Values.bot.webhook.host | quote }}
  webhook-port: {{ .Values.bot.webhook.port | quote }}
  webhook-path: {{ .Values.bot.webhook.path | quote }}
  webhook-callback-url: {{ .Values.bot.webhook.callbackUrl | quote }}
  log-level: {{ .Values.bot.logLevel | quote }}
  object-storage-endpoint: {{ default "" .Values.objectStorage.endpoint | quote }}
  object-storage-namespace: {{ default "" .Values.objectStorage.namespace | quote }}
  object-storage-region: {{ default "" .Values.objectStorage.region | quote }}
  object-storage-bucket: {{ default "" .Values.objectStorage.bucket | quote }}
  object-storage-prefix: {{ default "" .Values.objectStorage.prefix | quote }}
  object-storage-use-namespace-path: {{ ternary "true" "false" (default false .Values.objectStorage.useNamespacePath) | quote }}
  object-storage-verify-ssl: {{ ternary "true" "false" (default true .Values.objectStorage.verifySSL) | quote }}
  object-storage-lifecycle-days: {{ printf "%d" (default 0 .Values.objectStorage.lifecycleDays) | quote }}
  backup-schedule: {{ .Values.backupJob.schedule | quote }}
