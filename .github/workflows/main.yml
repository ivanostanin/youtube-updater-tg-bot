name: Tests

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  tests:
    name: Run quality gates and tests
    runs-on: ubuntu-latest
    env:
      ALLURE_VERSION: 2.35.1
      JAVA_VERSION: 25
      JAVA_CACHE_PATH: /opt/hostedtoolcache/Java_Oracle_jdk/25/x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Restore uv cache
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project with dev dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Restore JDK cache
        id: jdk-cache
        if: ${{ env.ACT == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.JAVA_CACHE_PATH }}
          key: oracle-openjdk-${{ env.JAVA_VERSION }}-${{ runner.os }}-x64

      - name: Install Java
        if: ${{ env.ACT == 'true' && steps.jdk-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set JAVA_HOME
        if: ${{ env.ACT == 'true' && steps.jdk-cache.outputs.cache-hit == 'true' }}
        run: |
          echo "JAVA_HOME=${{ env.JAVA_CACHE_PATH }}" >> $GITHUB_ENV
          echo "${{ env.JAVA_CACHE_PATH }}/bin" >> $GITHUB_PATH

      - name: Install Allure CLI
        run: |
          curl -sSL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.zip" -o allure.zip
          unzip -q allure.zip
          sudo rm -rf /opt/allure
          sudo rm -f /usr/local/bin/allure
          sudo mv "allure-${ALLURE_VERSION}" /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy src

      - name: Pytest with Allure
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term --alluredir=allure-results

      - name: Upload coverage xml
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
          retention-days: 30

      - name: Generate Allure HTML report
        if: ${{ always() }}
        run: |
          if [ -d allure-results ]; then
            allure generate allure-results --clean -o allure-report
          fi

      - name: Upload Allure HTML report
        if: ${{ always() && hashFiles('allure-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare Pages artifact
        if: ${{ always() }}
        run: |
          if [ -d allure-report ]; then
            mkdir -p publish/allure-latest
            cp -a allure-report/. publish/allure-latest/
          fi

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && hashFiles('publish/allure-latest/**') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Ensure uv cache
        if: ${{ always() }}
        id: uv-cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Ensure JDK cache
        id: jdk-cache
        if: ${{ env.ACT == 'true' && always() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.JAVA_CACHE_PATH }}
          key: oracle-openjdk-${{ env.JAVA_VERSION }}-${{ runner.os }}-x64

  test-report-deploy:
    name: Deploy Allure report to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: production
      url: https://ivanostanin.github.io/youtube-updater-tg-bot/allure-latest/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-push:
    name: Build and push Docker image to Docker Hub
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: docker.io
      IMAGE_NAME: youtube-updater-tg-bot

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deployment/docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1

    - name: Generate artifact attestation
      if: github.event_name != 'pull_request'
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true