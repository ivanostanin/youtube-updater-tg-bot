handlers:
  start:
    welcome: |-
      🎬 Welcome to YouTube Updater Bot!

      I can help you subscribe to YouTube channels and get notifications when new videos are uploaded.

      Available commands:
      /subscribe <URL> - Subscribe to a YouTube channel/video
      /list - Show your active subscriptions
      /unsubscribe - Remove subscriptions
      /channel_link <@channel> - Link a broadcast channel from a DM
      /channel_select - Switch the active channel context in DMs
      /language - Select your preferred language
      /help - Show this help

      Just send me a YouTube URL to get started!
  help:
    text: |-
      🎬 YouTube Updater Bot Commands:

      /start - Start the bot
      /subscribe <URL> - Subscribe to a YouTube channel/video
      /list - Show your active subscriptions
      /unsubscribe - Remove subscriptions
      /channel_link <@channel> - Link a broadcast channel from a DM
      /channel_select - Switch the active channel context in DMs
      /language - Select your preferred language
      /help - Show this help

      You can also send a YouTube URL directly!

      Supported URL formats:
      • Channel: youtube.com/channel/CHANNEL_ID
      • Channel: youtube.com/@username
      • Video: youtube.com/watch?v=VIDEO_ID
  subscribe:
    missing_url: |-
      Please provide a YouTube URL.
      Example: /subscribe https://youtube.com/@channelname
    processing: "🔍 Processing YouTube URL..."
    resolve_failed: "❌ Could not process this YouTube URL. Please check the URL and try again."
    playlist_not_supported: "ℹ️ Playlist subscriptions are not yet supported. Please subscribe to the channel instead."
    error: "❌ An error occurred while processing the URL. Please try again later."
    video:
      already_subscribed: |-
        ℹ️ You're already subscribed to **{channel_name}**
        (Found via video: {video_title})
      subscribing: |-
        ✅ Subscribing to **{channel_name}**...
        🔗 Setting up notifications...
      success: |-
        ✅ Successfully subscribed to **{channel_name}**!
        (Found via video: {video_title})

        You'll receive notifications when new videos are uploaded.
      warning: |-
        ⚠️ Subscribed to **{channel_name}** but couldn't set up real-time notifications.
        (Found via video: {video_title})

        You may experience delays in notifications.
    channel:
      already_subscribed: "ℹ️ You're already subscribed to **{channel_name}**."
      subscribing: |-
        ✅ Subscribing to **{channel_name}**...
        🔗 Setting up notifications...
      success: |-
        ✅ Successfully subscribed to **{channel_name}**!

        You'll receive notifications when new videos are uploaded.
      warning: |-
        ⚠️ Subscribed to **{channel_name}** but couldn't set up real-time notifications.

        You may experience delays in notifications.
  channel_link:
    private_only: "Run /channel_link inside a private DM with the bot."
    missing_identifier: |-
      Provide the channel @username, numeric chat ID, or forward a message from that channel and reply /channel_link.
      Example: /channel_link @examplechannel
    invalid_identifier: "I couldn't parse that channel reference. Use a public @username or numeric chat ID."
    bot_unavailable: "Telegram bot client isn't ready yet. Please try again in a few seconds."
    lookup_failed: "I couldn't load that channel. Double-check the username or invite link."
    invalid_type: "That chat isn't a broadcast channel. Run /channel_link with a channel username or ID."
    permission_check_failed: "I couldn't verify your admin rights right now. Please retry in a moment."
    admin_only: "Only channel administrators can link {channel_title}."
    bot_missing_permissions: "I need to be an admin with: {missing_permissions}. Update the channel permissions and try again."
    success: |-
      ✅ {channel_title} is linked.

      DM commands will target this channel for the next {ttl_minutes} minutes. Use /channel_select to switch at any time.
    forward_hint: |-
      For private channels, forward any recent message from the channel to this DM (or reply to one) and run /channel_link again so I can read the channel ID.
    permission_labels:
      can_post_messages: "Can post messages"
      can_delete_messages: "Can delete messages"
      can_edit_messages: "Can edit messages"
  channel_select:
    private_only: "Use /channel_select from a private DM with the bot."
    none_linked: "No channels are linked yet. Run /channel_link first."
    prompt: |-
      Pick which channel you would like to control.
      The selection lasts {ttl_minutes} minutes or until you switch.
    clear_button: "Direct messages"
    cleared: "Channel selection cleared. Commands now apply to direct messages."
    unknown_action: "I didn't understand that selection. Please open /channel_select again."
    invalid_payload: "Unable to parse the selected channel."
    channel_missing: "That channel record no longer exists. Link it again with /channel_link."
    link_missing: "You're no longer linked to that channel. Run /channel_link to relink it."
    revoked: "Telegram reports you're no longer an administrator, so access was revoked."
    bot_missing_permissions: "I'm missing required channel permissions ({missing_permissions}). Grant the rights and retry."
    selected: "Now targeting channel '{channel_title}'. Commands in this chat will apply there until you change it."
  channel_unlink:
    private_only: "Run /channel_unlink from a private DM with the bot."
    no_channel_selected: "Select a channel with /channel_select before unlinking."
    prompt: |-
      ⚠️ Unlink **{channel_title}**?

      This removes {subscription_count} subscription(s) and revokes admin access for everyone until you link it again.
    confirm_button: "Unlink channel"
    cancel_button: "Keep channel linked"
    cancelled: "Unlink cancelled. The channel remains linked."
    unknown_action: "I couldn't process that unlink action. Please run /channel_unlink again."
    invalid_payload: "Unable to parse the unlink request. Please retry."
    channel_missing: "I can't find that channel anymore. Link it again if needed."
    link_missing: "You're no longer linked to that channel. Run /channel_link to relink it."
    revoked: "Telegram reports you're no longer an admin for {channel_title}, so the unlink request was denied."
    completed: |-
      ✅ {channel_title} was unlinked.

      • Subscriptions removed: {subscription_count}
      • Webhooks cleaned up: {webhook_count}
      • Admin links revoked: {admin_count}
  channel_context:
    target_notice: "🎯 Channel context: {channel_title}"
    expired: "The active channel selection expired. Run /channel_select to choose a channel again."
    revoked: "Your access to {channel_title} was revoked, so I cleared that channel. Relink it to continue."
    bot_missing: "I can't post in {channel_title} because I'm missing: {missing_permissions}. Restore permissions and link again."
    forward_switch_success: "🎯 Channel context switched to {channel_title}."
    forward_link_missing: "I don't recognize that channel yet. Trying to link it."
  list:
    no_subscriptions: "You don't have any subscriptions yet."
    no_active_subscriptions: "You don't have any active subscriptions."
    no_active_subscriptions_channel: "{channel_title} doesn't have any active subscriptions yet."
  unsubscribe:
    no_subscriptions: "You don't have any subscriptions to remove."
    no_active_subscriptions: "You don't have any active subscriptions."
    no_active_subscriptions_channel: "{channel_title} doesn't have any subscriptions to remove."
    cancel_button: "Cancel"
    select_prompt: "Select a subscription to remove:"
    callback:
      missing_data: "Unable to process your request (missing data)."
      cancelled: "Cancelled."
      unknown_action: "Unknown action."
      parse_error: "Unable to parse subscription identifier."
      missing_context: "Unable to identify user or chat for this action."
      no_chat: "You do not have subscriptions in this chat."
      remove_failed: "❌ Failed to remove subscription."
      removing: |-
        ✅ Removing subscription...
        🔗 Cleaning up notifications...
      removed: "✅ Subscription removed successfully!"
      removed_with_warning: "✅ Subscription removed, but failed to clean up notifications."
  acl:
    missing_chat: "I couldn't identify which chat triggered this command."
    service_unavailable: "I can't verify admin permissions for this chat right now. Please try again later."
    missing_chat_id: "I couldn't identify the target chat for this action."
  message:
    unable_to_extract_url: "I found a YouTube link in your message, but couldn't extract the URL. Please send just the URL."
    prompt_private: |-
      Send me a YouTube URL to subscribe to a channel!
      Or use /help to see available commands.
  language:
    prompt: |-
      🌐 Select your preferred language.

      Current: {current_language}
    invalid_selection: "Unable to use that language option. Please try again."
    missing_context: "I couldn't identify the chat for this selection."
    missing_chat: "No chat record found for this selection."
    already_selected: "Language is already set to {language_name}."
    updated: "✅ Language updated to {language_name}."
    option:
      en: "English (en)"
      ru: "Русский (ru)"
      de: "Deutsch (de)"
    name:
      en: "English"
      ru: "Русский"
      de: "Deutsch"

acl:
  missing_user: "I couldn't identify the user running this command. Please issue the command from your personal account while a member of this chat."
  admin_only: "Only chat administrators can manage subscriptions here."

formatters:
  subscription:
    header:
      private: "📋 Your subscriptions:"
      group: "📋 Subscriptions shared with {chat_title}:"
      supergroup: "📋 Subscriptions for {chat_title}:"
      channel: "📋 Channels tracked for {chat_title}:"
    unnamed:
      group: "this group"
      supergroup: "this supergroup"
      channel: "this channel"
    item_line: "• {channel_name}"
    item_link: "  {channel_url}"
    footer: "Use {command} to remove a channel."
  group_prompt:
    shared: |-
      💬 Keep the conversation going with {chat_title}.
      Ask for thoughts, share highlights, or schedule a watch party!
    channel: |-
      📣 Share this update with {chat_title} and pin it if it's important.
      💡 Add your own summary so followers know why it matters.
    shared_fallback: "everyone here"
    channel_fallback: "everyone here"

notifications:
  video:
    heading: "🎬 **New Video Alert!**"
    channel: "📺 **Channel:** {channel_name}"
    video: "🎥 **Video:** {video_title}"
    description: "📝 **Description:** {video_description}"
    watch: "🔗 **Watch:** {video_url}"
    published: "📅 Published: {published_at}"
  subscription:
    private_title: "✅ **Subscription Confirmed!**"
    shared_title: "✅ **Chat Subscription Activated!**"
    private_body: "You'll receive notifications when new videos are uploaded."
    shared_body: "Everyone in {chat_title} will see updates from this YouTube channel."
    default_audience: "this chat"
    message: |-
      {intro}

      **Channel:** {channel_name}
      {context_line}

      Channel URL: {channel_url}
  error: "❌ **Error:** {error_message}"
