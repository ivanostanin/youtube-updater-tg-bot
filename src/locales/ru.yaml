handlers:
  start:
    welcome: |-
      🎬 Добро пожаловать в YouTube Updater Bot!

      Я помогу подписаться на YouTube-каналы и присылать уведомления о новых роликах.

      Доступные команды:
      /subscribe <URL> — подписаться на канал/ролик
      /list — показать активные подписки
      /unsubscribe — удалить подписку
      /channel_link <@channel> — привязать канал в личном чате
      /channel_select — выбрать активный канал в DM
      /language — выбрать язык
      /help — справка

      Просто отправьте ссылку на YouTube — и мы начнём!
  help:
    text: |-
      🎬 Команды YouTube Updater Bot:

      /start — запустить бота
      /subscribe <URL> — подписаться на канал/ролик
      /list — показать активные подписки
      /unsubscribe — удалить подписку
      /channel_link <@channel> — привязать канал в личном чате
      /channel_select — выбрать активный канал в DM
      /language — выбрать язык
      /help — справка

      Можно также просто отправить ссылку на YouTube!

      Поддерживаемые форматы:
      • Канал: youtube.com/channel/CHANNEL_ID
      • Канал: youtube.com/@username
      • Видео: youtube.com/watch?v=VIDEO_ID
  subscribe:
    missing_url: |-
      Пожалуйста укажите ссылку на YouTube.
      Пример: /subscribe https://youtube.com/@channelname
    processing: "🔍 Обрабатываю ссылку..."
    resolve_failed: "❌ Не удалось обработать ссылку. Проверьте URL и попробуйте ещё раз."
    playlist_not_supported: "ℹ️ Подписка на плейлисты пока недоступна. Подпишитесь на канал напрямую."
    error: "❌ При обработке ссылки произошла ошибка. Повторите попытку позже."
    video:
      already_subscribed: |-
        ℹ️ Вы уже подписаны на **{channel_name}**
        (найдено через видео: {video_title})
      subscribing: |-
        ✅ Подписываюсь на **{channel_name}**...
        🔗 Настраиваю уведомления...
      success: |-
        ✅ Подписка на **{channel_name}** оформлена!
        (найдено через видео: {video_title})

        Вы будете получать уведомления о новых роликах.
      warning: |-
        ⚠️ Подписка на **{channel_name}** оформлена, но не удалось подключить мгновенные уведомления.
        (найдено через видео: {video_title})

        Возможны задержки в доставке уведомлений.
    channel:
      already_subscribed: "ℹ️ Вы уже подписаны на **{channel_name}**."
      subscribing: |-
        ✅ Подписываюсь на **{channel_name}**...
        🔗 Настраиваю уведомления...
      success: |-
        ✅ Подписка на **{channel_name}** оформлена!

        Вы будете получать уведомления о новых роликах.
      warning: |-
        ⚠️ Подписка на **{channel_name}** оформлена, но не удалось подключить мгновенные уведомления.

        Возможны задержки в доставке уведомлений.
  channel_link:
    private_only: "Выполняйте /channel_link в личном чате с ботом."
    missing_identifier: |-
      Укажите @username, числовой ID канала либо перешлите сообщение из канала и ответьте командой /channel_link.
      Пример: /channel_link @examplechannel
    invalid_identifier: "Не удалось распознать ссылку на канал. Используйте публичный @username или числовой ID."
    bot_unavailable: "Клиент Telegram ещё не готов. Попробуйте через несколько секунд."
    lookup_failed: "Не удалось загрузить канал. Проверьте имя пользователя или ссылку."
    invalid_type: "Этот чат не является каналом. Укажите именно канал."
    permission_check_failed: "Не удалось проверить ваши права администратора. Повторите попытку позже."
    admin_only: "Только администраторы могут привязать {channel_title}."
    bot_missing_permissions: "Добавьте бота с правами: {missing_permissions}, затем повторите команду."
    success: |-
      ✅ {channel_title} привязан.

      Команды в DM будут относиться к этому каналу {ttl_minutes} мин. Используйте /channel_select, чтобы переключиться.
    forward_hint: |-
      Для приватных каналов перешлите недавнее сообщение из канала в этот чат (или ответьте на него) и снова выполните /channel_link, чтобы я увидел ID канала.
    permission_labels:
      can_post_messages: "Право отправлять сообщения"
      can_delete_messages: "Право удалять сообщения"
      can_edit_messages: "Право редактировать сообщения"
  channel_select:
    private_only: "Используйте /channel_select в личном чате с ботом."
    none_linked: "Ещё нет привязанных каналов. Сначала выполните /channel_link."
    prompt: |-
      Выберите канал, для которого нужно настроить уведомления.
      Выбор действует {ttl_minutes} минут или пока вы его не смените.
    clear_button: "Личные сообщения"
    cleared: "Выбор канала сброшен. Команды снова относятся к этому чату."
    unknown_action: "Неизвестный выбор. Откройте /channel_select заново."
    invalid_payload: "Не удалось распознать выбранный канал."
    channel_missing: "Запись канала не найдена. Привяжите его заново через /channel_link."
    link_missing: "Связь с этим каналом утеряна. Выполните /channel_link ещё раз."
    revoked: "Telegram сообщает, что вы больше не администратор, поэтому доступ удалён."
    bot_missing_permissions: "У бота нет обязательных прав ({missing_permissions}). Выдайте их и повторите."
    selected: "Теперь управляем каналом '{channel_title}'. Команды будут применяться к нему, пока вы не переключитесь."
  channel_unlink:
    private_only: "Выполняйте /channel_unlink в личном чате с ботом."
    no_channel_selected: "Сначала выберите канал через /channel_select."
    prompt: |-
      ⚠️ Отвязать **{channel_title}**?

      Это удалит {subscription_count} подписок и отключит доступ всех администраторов, пока вы не привяжете канал заново.
    confirm_button: "Отвязать канал"
    cancel_button: "Оставить как есть"
    cancelled: "Отмена: канал остаётся привязанным."
    unknown_action: "Не удалось обработать действие. Повторите /channel_unlink."
    invalid_payload: "Не получилось распознать запрос. Попробуйте снова."
    channel_missing: "Я больше не нахожу этот канал. При необходимости привяжите его заново."
    link_missing: "У вас больше нет связи с этим каналом. Используйте /channel_link, чтобы обновить доступ."
    revoked: "Telegram сообщил, что вы больше не администратор {channel_title}, поэтому запрос отклонён."
    completed: |-
      ✅ {channel_title} отвязан.

      • Удалено подписок: {subscription_count}
      • Очистка вебхуков: {webhook_count}
      • Отозвано доступов: {admin_count}
  channel_context:
    target_notice: "🎯 Активный канал: {channel_title}"
    expired: "Срок действия выбранного канала истёк. Используйте /channel_select, чтобы выбрать снова."
    revoked: "Ваши права на {channel_title} были отозваны, поэтому канал удалён из контекста. Выполните /channel_link повторно."
    bot_missing: "Я больше не могу публиковать в {channel_title}: отсутствуют права {missing_permissions}. Выдайте их и привяжите канал снова."
    forward_switch_success: "🎯 Контекст переключён на {channel_title}."
    forward_link_missing: "Я ещё не знаю этот канал. Пробую привязать."
  list:
    no_subscriptions: "У вас ещё нет подписок."
    no_active_subscriptions: "Активных подписок не найдено."
    no_active_subscriptions_channel: "{channel_title} пока не имеет активных подписок."
  unsubscribe:
    no_subscriptions: "В этом чате нет подписок для удаления."
    no_active_subscriptions: "Активных подписок не найдено."
    no_active_subscriptions_channel: "У {channel_title} нет подписок для удаления."
    cancel_button: "Отмена"
    select_prompt: "Выберите подписку для удаления:"
    callback:
      missing_data: "Невозможно обработать запрос (не хватает данных)."
      cancelled: "Отменено."
      unknown_action: "Неизвестное действие."
      parse_error: "Не удалось распознать идентификатор подписки."
      missing_context: "Не удалось определить пользователя или чат для этого действия."
      no_chat: "В этом чате нет подписок."
      remove_failed: "❌ Не удалось удалить подписку."
      removing: |-
        ✅ Удаляю подписку...
        🔗 Отключаю уведомления...
      removed: "✅ Подписка успешно удалена!"
      removed_with_warning: "✅ Подписка удалена, но очистить уведомления не удалось."
  acl:
    missing_chat: "Не удалось определить чат, из которого пришла команда."
    service_unavailable: "Сейчас не могу проверить права администратора. Попробуйте позже."
    missing_chat_id: "Не удалось определить целевой чат для этого действия."
  message:
    unable_to_extract_url: "Ссылка на YouTube найдена, но не распознана. Пожалуйста отправьте только URL."
    prompt_private: |-
      Отправьте ссылку на YouTube, чтобы подписаться на канал!
      Или используйте /help для просмотра команд.
  language:
    prompt: |-
      🌐 Выберите язык интерфейса.

      Текущий: {current_language}
    invalid_selection: "Эту языковую опцию использовать нельзя. Попробуйте снова."
    missing_context: "Не удалось определить чат для этого выбора."
    missing_chat: "Не найден чат для сохранения языка."
    already_selected: "Язык уже установлен: {language_name}."
    updated: "✅ Язык обновлён: {language_name}."
    option:
      en: "English (en)"
      ru: "Русский (ru)"
      de: "Deutsch (de)"
    name:
      en: "English"
      ru: "Русский"
      de: "Deutsch"

acl:
  missing_user: "Не удалось определить пользователя. Отправьте команду от своего аккаунта внутри этого чата."
  admin_only: "Только администраторы чата могут управлять подписками."

formatters:
  subscription:
    header:
      private: "📋 Ваши подписки:"
      group: "📋 Общие подписки в чате «{chat_title}»:"
      supergroup: "📋 Подписки для «{chat_title}»:"
      channel: "📋 Каналы для «{chat_title}»:"
    unnamed:
      group: "этом чате"
      supergroup: "этом супергрупповом чате"
      channel: "этом канале"
    item_line: "• {channel_name}"
    item_link: "  {channel_url}"
    footer: "Используйте {command}, чтобы удалить канал."
  group_prompt:
    shared: |-
      💬 Поддержите обсуждение с {chat_title}.
      Задавайте вопросы, делитесь мыслями или организуйте совместный просмотр!
    channel: |-
      📣 Поделитесь обновлением с {chat_title} и при необходимости закрепите сообщение.
      💡 Добавьте краткое описание, чтобы подписчики поняли, почему это важно.
    shared_fallback: "участниками"
    channel_fallback: "подписчиками"

notifications:
  video:
    heading: "🎬 **Новый ролик!**"
    channel: "📺 **Канал:** {channel_name}"
    video: "🎥 **Видео:** {video_title}"
    description: "📝 **Описание:** {video_description}"
    watch: "🔗 **Смотреть:** {video_url}"
    published: "📅 Опубликовано: {published_at}"
  subscription:
    private_title: "✅ **Подписка подтверждена!**"
    shared_title: "✅ **Подписка для чата активирована!**"
    private_body: "Вы будете получать уведомления о новых роликах."
    shared_body: "Все участники {chat_title} будут получать обновления этого YouTube-канала."
    default_audience: "этого чата"
    message: |-
      {intro}

      **Канал:** {channel_name}
      {context_line}

      Ссылка: {channel_url}
  error: "❌ **Ошибка:** {error_message}"
