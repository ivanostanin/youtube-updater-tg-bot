formatters:
  subscription:
    header:
      private: "📋 Deine Abonnements:"
      group: "📋 Gemeinsame Abonnements in {chat_title}:"
      supergroup: "📋 Abonnements für {chat_title}:"
      channel: "📋 Verfolgte Kanäle für {chat_title}:"
    unnamed:
      group: "diesem Chat"
      supergroup: "dieser Supergruppe"
      channel: "diesem Kanal"
    item_line: "• {channel_name}"
    item_link: "  {channel_url}"
    footer: "Nutze {command}, um einen Kanal zu entfernen."
  group_prompt:
    shared: |-
      💬 Halte das Gespräch mit {chat_title} am Laufen.
      Stelle Fragen, teile Highlights oder plane ein gemeinsames Anschauen!
    channel: |-
      📣 Teile dieses Update mit {chat_title} und pinne es bei Bedarf.
      💡 Ergänze eine kurze Zusammenfassung, damit alle wissen, warum es wichtig ist.
    shared_fallback: "allen hier"
    channel_fallback: "allen hier"

