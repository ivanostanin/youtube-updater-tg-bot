    service_unavailable: "Admin-Rechte können momentan nicht geprüft werden. Bitte später erneut versuchen."
    missing_chat_id: "Der Zielchat für diese Aktion konnte nicht ermittelt werden."
  message:
    unable_to_extract_url: "Ich habe einen YouTube-Link gefunden, konnte ihn aber nicht extrahieren. Bitte sende nur die URL."
    prompt_private: |-
      Sende mir eine YouTube-URL, um einen Kanal zu abonnieren!
      Oder nutze /help, um die Befehle anzuzeigen.
  language:
    prompt: |-
      🌐 Bitte wähle deine bevorzugte Sprache.

      Aktuell: {current_language}
